name: Publish Harrier source
on:
  push:
    paths:
      - '.github/workflows/publish-harrier.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message != 'Publish validated Harrier source files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source and verify
        run: |
          cat .payload/{01,02,03,04}.b64 | base64 --decode > /tmp/harrier-source.tar.xz
          tar -tJf /tmp/harrier-source.tar.xz
          tar -xJf /tmp/harrier-source.tar.xz -C .
          go test ./...
          go build -o /tmp/harrier .
      - name: Commit plain Go files, scripts and docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -r .payload
          git rm .github/workflows/publish-harrier.yml
          git commit -m "Publish validated Harrier source files"
          git push origin HEAD:main
